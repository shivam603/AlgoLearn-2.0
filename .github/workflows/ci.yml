name: AlgoLearn CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python & Native Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python-is-python3 gcc g++ default-jdk-headless

      - name: Install dependencies
        run: npm install && cd backend && npm install

      - name: JavaScript Syntax Verification
        run: |
          for f in backend/*.js backend/problems/*.js backend/debugger/*.js frontend/*.js tests/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Run Automated API, Judge, Profiler, Gamification & Socket.IO Duel Tests
        env:
          PORT: 3000
          MONGO_URI: ""
        run: |
          node backend/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/ai/status >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          node tests/algoai.test.js
          node tests/full-e2e.test.js

